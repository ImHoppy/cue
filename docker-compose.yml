services:
  app:
    build:
      context: .
      args:
        # Baked into the extension's manifest at build time, so it has to match
        # the URL the site is actually served from.
        PUBLIC_URL: ${PUBLIC_URL:?set PUBLIC_URL}
        EXT_BUILD: ${EXT_BUILD:-}
    restart: unless-stopped
    environment:
      PUBLIC_URL: ${PUBLIC_URL:?set PUBLIC_URL}
      COOKIE_SECRET: ${COOKIE_SECRET:?set COOKIE_SECRET}
      TWITCH_CLIENT_ID: ${TWITCH_CLIENT_ID:?set TWITCH_CLIENT_ID}
      TWITCH_CLIENT_SECRET: ${TWITCH_CLIENT_SECRET:?set TWITCH_CLIENT_SECRET}
      SPOTIFY_CLIENT_ID: ${SPOTIFY_CLIENT_ID:-}
      SPOTIFY_CLIENT_SECRET: ${SPOTIFY_CLIENT_SECRET:-}
      SPOTIFY_OPEN_LINKING: ${SPOTIFY_OPEN_LINKING:-}
      ADMIN_TWITCH_IDS: ${ADMIN_TWITCH_IDS:-}
    volumes:
      - ./data:/data
    expose:
      - "8080"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?set SITE_ADDRESS}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
