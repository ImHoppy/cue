<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Cue - Set up your overlay</title>
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,200..800&family=Inter+Tight:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Plus+Jakarta+Sans:ital,wght@0,400..800;1,400..800&display=swap">
	<link rel="stylesheet" href="/shared/overlay.css">
	<link rel="stylesheet" href="/shared/style-editor.css">
	<link rel="stylesheet" href="/assets/app.css">
</head>
<body>
	<header class="topbar">
		<a class="wordmark" href="/"><span class="lamp"></span>Cue</a>
		<span class="who" id="who"></span>
	</header>

	<main class="shell">
		<p class="eyebrow">Setup</p>
		<h1 style="font-size:clamp(30px,5vw,46px)">Let's get you on air.</h1>

		<section class="panel" id="panel1">
			<div class="panel-gutter"><b>1</b><span class="rail"></span></div>
			<div class="panel-body">
				<div class="panel-head">
					<h2>Where does your music come from?</h2>
					<span class="note" id="providerState"></span>
				</div>
				<div class="choices" id="providers"></div>
			</div>
		</section>

		<section class="panel muted" id="panel2">
			<div class="panel-gutter"><b>2</b><span class="rail"></span></div>
			<div class="panel-body">
				<div class="panel-head">
					<h2 id="step2Title">Install the extension and take your key</h2>
					<span class="note" id="step2Note"></span>
				</div>
				<div id="step2"></div>
			</div>
		</section>

		<section class="panel muted" id="panel3">
			<div class="panel-gutter"><b>3</b></div>
			<div class="panel-body">
				<div class="panel-head">
					<h2>Make it yours</h2>
					<span class="note">Saved as you go.</span>
				</div>
				<div id="studio"></div>
				<div class="row" style="margin-top:20px">
					<button class="btn primary" id="finish" type="button">Finish setup</button>
					<span class="note">You can change any of this later.</span>
				</div>
			</div>
		</section>
	</main>

	<script type="module">
		import { api, toast, copyField, el, mountStyleStudio, setLamp, PROVIDERS, BROWSERS, providerById } from "/assets/app.js";

		const account = await api("/api/me");
		let provider = account.provider;

		// ---- who ------------------------------------------------------------
		const who = document.getElementById("who");
		who.append(
			account.user.avatarUrl ? Object.assign(new Image(), { src: account.user.avatarUrl, alt: "" }) : el("span"),
			el("span", null, account.user.displayName)
		);
		const out = el("button", "btn quiet", "Sign out");
		out.addEventListener("click", () => {
			const f = document.createElement("form");
			f.method = "POST";
			f.action = "/logout";
			document.body.append(f);
			f.submit();
		});
		who.append(out);

		// ---- step 1: provider ------------------------------------------------
		const providersEl = document.getElementById("providers");
		const providerState = document.getElementById("providerState");

		const isAvailable = (id) => (account.availableProviders ?? []).includes(id);

		function renderProviders() {
			providersEl.innerHTML = "";
			for (const p of PROVIDERS) {
				const ready = isAvailable(p.id);
				const btn = el("button", "choice");
				btn.type = "button";
				btn.disabled = !ready;
				btn.setAttribute("aria-pressed", String(provider === p.id));
				btn.innerHTML = `
					<span class="tag">${ready ? "Ready" : "Soon"}</span>
					<h3>${p.name}</h3>
					<p>${p.tagline}</p>
					<p style="margin-top:8px">${p.how}</p>`;
				btn.addEventListener("click", () => choose(p.id));
				providersEl.append(btn);
			}
			providerState.textContent = provider ? `Using ${providerById(provider)?.name}` : "";
		}

		async function choose(id) {
			try {
				const next = await api("/api/me/provider", { method: "POST", body: { provider: id } });
				Object.assign(account, next);
				provider = next.provider;
				renderProviders();
				unlock();
				toast(`${providerById(provider)?.name} it is`);
			} catch (err) {
				toast(err.message, true);
			}
		}

		// ---- step 2: connect the source --------------------------------------
		const step2 = document.getElementById("step2");
		const step2Title = document.getElementById("step2Title");
		const step2Note = document.getElementById("step2Note");
		let browser = BROWSERS[0].id;

		function renderStep2() {
			step2.innerHTML = "";
			if (providerById(provider)?.transport === "account") renderLinkStep();
			else renderExtensionStep();

			step2.append(el("hr", "rule"));
			const obs = el("div");
			obs.append(copyField(account.overlayUrl, { label: "Overlay URL for OBS" }));
			const list = el("ol", "steps");
			for (const s of [
				"In OBS: Sources → + → Browser.",
				"Paste the URL above.",
				"Set the width and height to suit your scene — 400 x 400 is a good start.",
				"Leave “Shutdown source when not visible” off, so it reconnects on its own.",
			]) list.append(el("li", null, s));
			list.style.marginTop = "12px";
			obs.append(list);
			obs.append(el("p", "note", "This URL is not secret enough to show on stream — anyone with it can watch what you play. Rotate it from your dashboard if it leaks."));
			step2.append(obs);
		}

		function renderLinkStep() {
			step2Title.textContent = "Connect your Spotify account";
			step2Note.textContent = "Nothing to install.";

			const row = el("div", "row");
			const link = el("a", "btn primary", account.spotify ? "Reconnect Spotify" : "Connect Spotify");
			link.href = "/auth/spotify";
			row.append(link);
			if (account.spotify) {
				const off = el("button", "btn quiet", "Disconnect");
				off.type = "button";
				off.addEventListener("click", disconnectSpotify);
				row.append(off);
			}
			step2.append(row);

			step2.append(el("p", "note", account.spotify
				? `Connected as ${account.spotify.displayName || "your Spotify account"}. Cue reads your playback only while a browser source is open in OBS.`
				: "Cue asks for read-only access to what you are playing. It cannot start, stop or change anything, and it only looks while OBS has your overlay open."));

			const steps = el("ol", "steps");
			for (const s of [
				"Sign in to Spotify and approve the read-only access.",
				"Play something on any device — desktop, phone or the web player.",
				"Paste the overlay URL below into OBS.",
			]) steps.append(el("li", null, s));
			steps.style.marginTop = "14px";
			step2.append(steps);
		}

		async function disconnectSpotify() {
			try {
				await api("/api/me/spotify/disconnect", { method: "POST" });
				account.spotify = null;
				renderStep2();
				toast("Spotify disconnected");
			} catch (err) {
				toast(err.message, true);
			}
		}

		function renderExtensionStep() {
			step2Title.textContent = "Install the extension and take your key";
			step2Note.textContent = "";

			const pick = el("div", "choices");
			for (const b of BROWSERS) {
				const btn = el("button", "choice");
				btn.type = "button";
				btn.setAttribute("aria-pressed", String(browser === b.id));
				btn.innerHTML = `<span class="tag">${b.engine}</span><h3>${b.name}</h3><p>${b.note}</p>`;
				btn.addEventListener("click", () => {
					browser = b.id;
					renderStep2();
				});
				pick.append(btn);
			}
			step2.append(pick);

			const chosen = BROWSERS.find((b) => b.id === browser);
			const grab = el("div", "row");
			grab.style.marginTop = "16px";
			if (account.downloads[browser]) {
				const link = el("a", "btn primary", `Download for ${chosen.engine}`);
				link.href = `/downloads/${browser}`;
				grab.append(link);
			} else {
				grab.append(el("span", "note", "No build is published for this browser yet — build it from the repo with `node extension/build.mjs --zip`."));
			}
			step2.append(grab);

			const steps = el("ol", "steps");
			for (const s of chosen.steps) steps.append(el("li", null, s));
			steps.style.marginTop = "14px";
			step2.append(steps);

			// ---- the key ----
			step2.append(el("hr", "rule"));
			const keyBox = el("div");
			keyBox.id = "keyBox";
			step2.append(keyBox);
			renderKey();
		}

		// Held in memory only, so switching browser tabs in step 2 does not wipe a
		// key off the screen before it has been pasted anywhere.
		let revealedKey = null;

		function renderKey() {
			const keyBox = document.getElementById("keyBox");
			keyBox.innerHTML = "";
			if (revealedKey) return void keyBox.append(revealBox(revealedKey));
			keyBox.append(copyField(null, { label: "Extension key", masked: account.key?.masked ?? "no key yet" }));
			const row = el("div", "row");
			row.style.marginTop = "10px";
			const gen = el("button", "btn", "Show me a key");
			gen.addEventListener("click", generateKey);
			row.append(gen, el("span", "note", "Cue only stores a fingerprint of your key, so it can show it to you once and never again."));
			keyBox.append(row);
		}

		function revealBox(writeKey) {
			const reveal = el("div", "reveal");
			reveal.append(el("p", "warn", "Copy this into the extension now. It is not shown again."));
			reveal.append(copyField(writeKey, { label: "Extension key" }));
			reveal.append(el("p", "note", "Open the extension, paste it into Key, and press Connect. Any key you had before has stopped working."));
			return reveal;
		}

		async function generateKey() {
			try {
				const res = await api("/api/me/key/regenerate", { method: "POST" });
				Object.assign(account, res.account);
				revealedKey = res.writeKey;
				renderKey();
			} catch (err) {
				toast(err.message, true);
			}
		}

		// ---- step 3: style ---------------------------------------------------
		const studio = mountStyleStudio(document.getElementById("studio"), {
			settings: account.settings,
		});
		setLamp(true);

		document.getElementById("finish").addEventListener("click", async (ev) => {
			if (providerById(provider)?.transport === "account" && !account.spotify) {
				return toast("Connect your Spotify account in step 2 first", true);
			}
			ev.target.disabled = true;
			try {
				await studio.flush();
				await api("/api/me/setup-done", { method: "POST" });
				location.href = "/dashboard";
			} catch (err) {
				ev.target.disabled = false;
				toast(err.message, true);
			}
		});

		// ---- gating ----------------------------------------------------------
		function unlock() {
			const open = !!provider;
			for (const id of ["panel2", "panel3"]) {
				document.getElementById(id).classList.toggle("muted", !open);
			}
			document.getElementById("panel1").classList.toggle("done", open);
			if (open) renderStep2();
		}

		const linkResult = new URLSearchParams(location.search).get("spotify");
		if (linkResult) {
			history.replaceState(null, "", location.pathname);
			if (linkResult === "linked") toast("Spotify connected");
			else if (linkResult === "unconfigured") toast("Spotify is not configured on this server", true);
			else toast("Spotify did not connect — try again", true);
		}

		renderProviders();
		unlock();
	</script>
</body>
</html>
