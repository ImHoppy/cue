<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Cue · Setup</title>
	<script>prefetch("/api/me")</script>
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,200..800&family=Inter+Tight:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Plus+Jakarta+Sans:ital,wght@0,400..800;1,400..800&display=swap">
	<link rel="stylesheet" href="/shared/overlay.css">
	<link rel="stylesheet" href="/shared/style-editor.css">
	<link rel="stylesheet" href="/assets/app.css">
</head>
<body>
	<header class="topbar">
		<a class="wordmark" href="/"><span class="lamp"></span>Cue</a>
		<span class="who" id="who"></span>
	</header>

	<main class="shell">
		<p class="eyebrow" data-i18n="setup.eyebrow">Setup</p>
		<h1 style="font-size:clamp(30px,5vw,46px)" data-i18n="setup.h1">Let's get you on air.</h1>

		<section class="panel" id="panel1">
			<div class="panel-gutter"><b>1</b><span class="rail"></span></div>
			<div class="panel-body">
				<div class="panel-head">
					<h2 data-i18n="setup.step1.title">Where does your music come from?</h2>
					<span class="note" id="providerState"></span>
				</div>
				<div class="choices" id="providers"></div>
			</div>
		</section>

		<section class="panel muted" id="panel2">
			<div class="panel-gutter"><b>2</b><span class="rail"></span></div>
			<div class="panel-body">
				<div class="panel-head">
					<h2 id="step2Title" data-i18n="setup.step2.extension.title">Install the extension and take your key</h2>
					<span class="note" id="step2Note"></span>
				</div>
				<div id="step2"></div>
			</div>
		</section>

		<section class="panel muted" id="panel3">
			<div class="panel-gutter"><b>3</b></div>
			<div class="panel-body">
				<div class="panel-head">
					<h2 data-i18n="setup.step3.title">Make it yours</h2>
					<span class="note" data-i18n="setup.step3.note">Saved as you go.</span>
				</div>
				<div id="studio"></div>
				<div class="row" style="margin-top:20px">
					<button class="btn primary" id="finish" type="button" data-i18n="setup.finish">Finish setup</button>
					<span class="note" data-i18n="setup.finishNote">You can change any of this later.</span>
				</div>
			</div>
		</section>
	</main>

	<script type="module">
		import { api, toast, copyField, el, mountStyleStudio, setLamp, mountLangSwitch, t, PROVIDERS, BROWSERS, providerById } from "/assets/app.js";

		const account = await api("/api/me");
		let provider = account.provider;

		// ---- who ------------------------------------------------------------
		const who = document.getElementById("who");
		who.append(
			account.user.avatarUrl ? Object.assign(new Image(), { src: account.user.avatarUrl, alt: "" }) : el("span"),
			el("span", null, account.user.displayName)
		);
		mountLangSwitch(who);
		const out = el("button", "btn quiet", t("common.signOut"));
		out.addEventListener("click", () => {
			const f = document.createElement("form");
			f.method = "POST";
			f.action = "/logout";
			document.body.append(f);
			f.submit();
		});
		who.append(out);

		// ---- step 1: provider ------------------------------------------------
		const providersEl = document.getElementById("providers");
		const providerState = document.getElementById("providerState");

		const isAvailable = (id) => (account.availableProviders ?? []).includes(id);

		function renderProviders() {
			providersEl.innerHTML = "";
			for (const p of PROVIDERS) {
				const ready = isAvailable(p.id);
				const btn = el("button", "choice");
				btn.type = "button";
				btn.disabled = !ready;
				btn.setAttribute("aria-pressed", String(provider === p.id));
				const closed = !ready && p.id === "spotify" && account.spotifyClosed;
				btn.append(
					el("span", "tag", ready ? t("setup.ready") : closed ? t("setup.closed") : t("setup.soon")),
					el("h3", null, t(p.nameKey)),
					el("p", null, t(p.taglineKey))
				);
				const how = el("p", null, t(p.howKey));
				how.style.marginTop = "8px";
				btn.append(how);
				btn.addEventListener("click", () => choose(p.id));
				providersEl.append(btn);
			}
			providerState.textContent = provider
				? t("setup.using", { name: t(providerById(provider)?.nameKey) })
				: "";
		}

		async function choose(id) {
			try {
				const next = await api("/api/me/provider", { method: "POST", body: { provider: id } });
				Object.assign(account, next);
				provider = next.provider;
				renderProviders();
				unlock();
				toast(t("setup.chose", { name: t(providerById(provider)?.nameKey) }));
			} catch (err) {
				toast(err.message, true);
			}
		}

		// ---- step 2: connect the source --------------------------------------
		const step2 = document.getElementById("step2");
		const step2Title = document.getElementById("step2Title");
		const step2Note = document.getElementById("step2Note");
		let browser = BROWSERS[0].id;

		function renderStep2() {
			step2.innerHTML = "";
			if (providerById(provider)?.transport === "account") renderLinkStep();
			else renderExtensionStep();

			step2.append(el("hr", "rule"));
			const obs = el("div");
			obs.append(copyField(account.overlayUrl, { label: t("setup.overlayUrlLabel") }));
			const list = el("ol", "steps");
			for (const key of ["setup.obs.1", "setup.obs.2", "setup.obs.3", "setup.obs.4"]) {
				list.append(el("li", null, t(key)));
			}
			list.style.marginTop = "12px";
			obs.append(list);
			obs.append(el("p", "note", t("setup.urlWarning")));
			step2.append(obs);
		}

		function renderLinkStep() {
			step2Title.textContent = t("setup.step2.link.title");
			step2Note.textContent = t("setup.step2.link.note");

			const row = el("div", "row");
			if (!account.spotifyClosed) {
				const link = el("a", "btn primary", t(account.spotify ? "setup.spotify.reconnect" : "setup.spotify.connect"));
				link.href = "/auth/spotify";
				row.append(link);
			}
			if (account.spotify) {
				const off = el("button", "btn quiet", t("setup.spotify.disconnect"));
				off.type = "button";
				off.addEventListener("click", disconnectSpotify);
				row.append(off);
			}
			step2.append(row);

			if (account.spotifyClosed) step2.append(el("p", "warn", t("setup.spotify.closed")));

			step2.append(el("p", "note", account.spotify
				? t("setup.spotify.connectedAs", {
						name: account.spotify.displayName || t("setup.spotify.yourAccount"),
					})
				: t("setup.spotify.readOnly")));

			const steps = el("ol", "steps");
			for (const key of ["setup.spotify.step.1", "setup.spotify.step.2", "setup.spotify.step.3"]) {
				steps.append(el("li", null, t(key)));
			}
			steps.style.marginTop = "14px";
			step2.append(steps);
		}

		async function disconnectSpotify() {
			try {
				await api("/api/me/spotify/disconnect", { method: "POST" });
				account.spotify = null;
				renderStep2();
				toast(t("setup.spotify.disconnected"));
			} catch (err) {
				toast(err.message, true);
			}
		}

		function renderExtensionStep() {
			step2Title.textContent = t("setup.step2.extension.title");
			step2Note.textContent = "";

			const pick = el("div", "choices");
			for (const b of BROWSERS) {
				const btn = el("button", "choice");
				btn.type = "button";
				btn.setAttribute("aria-pressed", String(browser === b.id));
				btn.append(
					el("span", "tag", b.engine),
					el("h3", null, t(b.nameKey)),
					el("p", null, t(b.noteKey))
				);
				btn.addEventListener("click", () => {
					browser = b.id;
					renderStep2();
				});
				pick.append(btn);
			}
			step2.append(pick);

			const chosen = BROWSERS.find((b) => b.id === browser);
			const grab = el("div", "row");
			grab.style.marginTop = "16px";
			if (account.downloads[browser]) {
				const link = el("a", "btn primary", t("setup.download", { engine: chosen.engine }));
				link.href = `/downloads/${browser}`;
				grab.append(link);
				const version = account.extensionVersions?.[browser];
				if (version) grab.append(el("span", "note", `v${version}`));
			} else {
				grab.append(el("span", "note", t("setup.noBuild")));
			}
			step2.append(grab);

			const steps = el("ol", "steps");
			for (const key of chosen.stepKeys) steps.append(el("li", null, t(key)));
			steps.style.marginTop = "14px";
			step2.append(steps);

			// ---- the key ----
			step2.append(el("hr", "rule"));
			const keyBox = el("div");
			keyBox.id = "keyBox";
			step2.append(keyBox);
			renderKey();
		}

		// Held in memory only, so switching browser tabs in step 2 does not wipe a
		// key off the screen before it has been pasted anywhere.
		let revealedKey = null;

		function renderKey() {
			const keyBox = document.getElementById("keyBox");
			keyBox.innerHTML = "";
			if (revealedKey) return void keyBox.append(revealBox(revealedKey));
			keyBox.append(copyField(null, {
				label: t("setup.key.label"),
				masked: account.key?.masked ?? t("setup.key.none"),
			}));
			const row = el("div", "row");
			row.style.marginTop = "10px";
			const gen = el("button", "btn", t("setup.key.generate"));
			gen.addEventListener("click", generateKey);
			row.append(gen, el("span", "note", t("setup.key.fingerprint")));
			keyBox.append(row);
		}

		function revealBox(writeKey) {
			const reveal = el("div", "reveal");
			reveal.append(el("p", "warn", t("setup.key.copyNow")));
			reveal.append(copyField(writeKey, { label: t("setup.key.label") }));
			reveal.append(el("p", "note", t("setup.key.paste")));
			return reveal;
		}

		async function generateKey() {
			try {
				const res = await api("/api/me/key/regenerate", { method: "POST" });
				Object.assign(account, res.account);
				revealedKey = res.writeKey;
				renderKey();
			} catch (err) {
				toast(err.message, true);
			}
		}

		// ---- step 3: style ---------------------------------------------------
		const studio = mountStyleStudio(document.getElementById("studio"), {
			settings: account.settings,
		});
		setLamp(true);

		document.getElementById("finish").addEventListener("click", async (ev) => {
			if (providerById(provider)?.transport === "account" && !account.spotify) {
				return toast(t("setup.spotify.needed"), true);
			}
			ev.target.disabled = true;
			try {
				await studio.flush();
				await api("/api/me/setup-done", { method: "POST" });
				location.href = "/dashboard";
			} catch (err) {
				ev.target.disabled = false;
				toast(err.message, true);
			}
		});

		// ---- gating ----------------------------------------------------------
		function unlock() {
			const open = !!provider;
			for (const id of ["panel2", "panel3"]) {
				document.getElementById(id).classList.toggle("muted", !open);
			}
			document.getElementById("panel1").classList.toggle("done", open);
			if (open) renderStep2();
		}

		const linkResult = new URLSearchParams(location.search).get("spotify");
		if (linkResult) {
			history.replaceState(null, "", location.pathname);
			if (linkResult === "linked") toast(t("setup.spotify.connected"));
			else if (linkResult === "unconfigured") toast(t("setup.spotify.unconfigured"), true);
			else if (linkResult === "closed") toast(t("setup.spotify.closedToast"), true);
			else toast(t("setup.spotify.failed"), true);
		}

		renderProviders();
		unlock();
	</script>
</body>
</html>
